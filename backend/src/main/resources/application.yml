spring:
  application:
    name: persons-catalog
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/persons}
    username: ${DATABASE_USERNAME:persons}
    password: ${DATABASE_PASSWORD:persons}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

logging:
  level:
    org.hibernate.SQL: debug

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
  storage:
    type: ${APP_STORAGE_TYPE:local}
    path: ${APP_STORAGE_PATH:./uploads}
    base-url: ${APP_STORAGE_BASE_URL:http://localhost:8080/uploads}
    s3:
      endpoint: ${SUPABASE_S3_ENDPOINT:}
      region: ${SUPABASE_S3_REGION:auto}
      access-key: ${SUPABASE_S3_ACCESS_KEY:}
      secret-key: ${SUPABASE_S3_SECRET_KEY:}
      bucket: ${SUPABASE_S3_BUCKET:photos}
